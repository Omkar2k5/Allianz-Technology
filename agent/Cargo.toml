[package]
name = "ecocompute-agent"
version = "0.1.0"
edition = "2021"
authors = ["Allianz Technology"]
description = "Windows desktop agent for AI usage monitoring"

[dependencies]
# Async runtime
tokio = { version = "1.35", features = ["full"] }
tokio-util = { version = "0.7", features = ["full"] }

# HTTP/Proxy
hyper = { version = "1.1", features = ["full", "server", "http1", "http2"] }
hyper-util = { version = "0.1", features = ["full"] }
http-body-util = "0.1"
bytes = "1.5"

# TLS/SSL
rustls = "0.22"
tokio-rustls = "0.25"
rcgen = "0.12"
rustls-pemfile = "2.0"
webpki-roots = "0.26"

# HTTP client (for forwarding requests)
reqwest = { version = "0.11", features = ["json", "rustls-tls"] }

# JSON parsing
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Database (local cache)
rusqlite = { version = "0.30", features = ["bundled"] }

# Windows-specific
windows = { version = "0.52", features = [
    "Win32_Foundation",
    "Win32_System_Services",
    "Win32_System_Registry",
    "Win32_Security",
    "Win32_UI_Shell",
    "Win32_NetworkManagement_IpHelper",
    "Win32_System_Threading",
    "Win32_System_Diagnostics_ToolHelp"
]}
windows-service = "0.6"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

# Configuration
config = "0.13"
toml = "0.8"

# Utilities
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.6", features = ["v4", "serde"] }
anyhow = "1.0"
thiserror = "1.0"
regex = "1.10"
whoami = "1.4"
flate2 = "1.0"  # For gzip decompression of ChatGPT responses
urlencoding = "2.1"  # For Gemini URL-encoded request parsing

# Authentication
dialoguer = "0.11"
base64 = "0.21"

# System tray (optional for now)
# tray-icon = "0.11"

[dev-dependencies]
tokio-test = "0.4"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

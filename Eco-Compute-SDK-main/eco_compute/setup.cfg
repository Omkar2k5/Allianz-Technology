[metadata]
name = eco-compute
version = 0.1.0
description = A provider-agnostic SDK for tracking energy usage, carbon emissions, and sustainability metrics for LLM API calls
long_description = file: README.md
long_description_content_type = text/markdown
author = Eco-Compute Contributors
author_email = ecocompute@example.com
license = MIT
license_files = LICENSE
classifiers =
    Development Status :: 4 - Beta
    Intended Audience :: Developers
    Intended Audience :: Science/Research
    License :: OSI Approved :: MIT License
    Operating System :: OS Independent
    Programming Language :: Python :: 3
    Programming Language :: Python :: 3.9
    Programming Language :: Python :: 3.10
    Programming Language :: Python :: 3.11
    Programming Language :: Python :: 3.12
    Topic :: Scientific/Engineering :: Artificial Intelligence
    Topic :: Software Development :: Libraries :: Python Modules
    Typing :: Typed
keywords = llm, sustainability, carbon, energy, ai, machine-learning, esg

[options]
packages = find:
python_requires = >=3.9
install_requires =
    requests>=2.28.0
    typing-extensions>=4.0.0

[options.extras_require]
dev =
    pytest>=7.0.0
    mypy>=1.0.0
    black>=23.0.0
    isort>=5.12.0
    flake8>=6.0.0

[options.package_data]
eco_compute = py.typed
